<!doctype html>
<!--
CONTRACT - voice recorder (private, not linked anywhere, noindex)
What: shows Robert one short chunk at a time in big text with a big Record button. Each chunk is recorded
      several times ("takes"); tap to record, tap to stop; the take uploads straight to Supabase
      (edge function voice-drop -> private bucket 'voice', table voice_takes, line_text = "<set> | chunk N | take T | words").
Sets: ?set=roe (default) = chunks for the roe prosciutto reel (3 Nov). ?set=lines = the original 5 long lines.
Key:  the shared secret travels in the URL hash (#k=...), never in the page source.
-->
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Voice takes · Artisan by Robert</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--green:#1F3A2B;--cream:#F5F1E8;--gold:#D9A441;--soft:#DCE6DC;--red:#C0392B}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--green);color:var(--cream);font-family:Inter,system-ui,sans-serif;
 padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
 display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;gap:8px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:800}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--soft)}.dots i.done{background:var(--gold);border-color:var(--gold)}
.line{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(40px,12vw,84px);line-height:1.12;font-weight:900;min-height:0;overflow:auto}
.how{font-size:17px;color:var(--soft);text-align:center;line-height:1.35}
.status{min-height:1.4em;font-size:18px;font-weight:700;color:var(--gold);text-align:center}
.rec{align-self:center;width:150px;height:150px;border-radius:50%;border:6px solid var(--cream);background:var(--red);color:#fff;font:inherit;font-size:22px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.rec.on{background:#fff;color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row button{font:inherit;font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:12px;padding:15px 8px;border:2px solid var(--soft);background:transparent;color:var(--cream);cursor:pointer}
button:disabled{opacity:.35}
</style></head><body>
<div class="top"><span id="count">Chunk 1</span><span id="take">Take 1 of 5</span></div>
<div class="dots" id="dots"></div>
<div class="line" id="line"></div>
<div class="how" id="how"></div>
<div class="status" id="status">Tap the red button, say it once, tap again.</div>
<button class="rec" id="rec" type="button">Record</button>
<div class="row"><button id="back" type="button">Back</button><button id="next" type="button">Next chunk</button></div>
<script>
const SETS={
 roe:{takes:5,chunks:[
  ["Day one.","Short and clear, like announcing it."],
  ["Wild roe haunch.","Proud. Smile as you say it."],
  ["Months later.","Slow down a touch. Let it land."],
  ["Prosciutto di Cervo.","Like you're introducing a friend."],
  ["Air-dried venison ham.","Warm and plain."],
  ["Made like Parma ham.","A little lift at the end."],
  ["Salt, time and air.","Three beats. Salt... time... and air."],
  ["Britain's native deer.","Proud, like it's your home ground."],
  ["Follow for the next one.","Friendly, like waving someone over."]
 ]},
 lines:{takes:2,chunks:[
  ["What is Prosciutto di Cervo? It's air-dried venison ham, made the way Parma ham is made, from the haunch of wild British deer.",""],
  ["What is Ducatello? Wild mallard, cured slowly, like prosciutto. Six months for one slice.",""],
  ["How long does it take? A small muntjac haunch, about five weeks. A big fallow haunch, up to six months.",""],
  ["Why no nitrates? I take the bone out before it cures. Salt, time and air. Nothing else.",""],
  ["I'm Robert. I cure wild British game by hand, in Hampshire. Follow along for the next one.",""]
 ]}
};
const q=new URLSearchParams(location.search); const SETNAME=SETS[q.get('set')]?q.get('set'):'roe'; const S=SETS[SETNAME];
const KEY=(new URLSearchParams(location.hash.slice(1))).get('k')||'';
const URL_='https://rgmstzswgosoelvamgds.supabase.co/functions/v1/voice-drop';
let c=0,t=0,rec=null,chunks=[],stream=null;
const $=id=>document.getElementById(id);
function show(){ $('line').textContent=S.chunks[c][0]; $('how').textContent=S.chunks[c][1]||'';
  $('count').textContent='Chunk '+(c+1)+' of '+S.chunks.length; $('take').textContent='Take '+Math.min(t+1,S.takes)+' of '+S.takes;
  $('dots').innerHTML=Array.from({length:S.takes},(_,k)=>'<i class="'+(k<t?'done':'')+'"></i>').join('');
  $('back').disabled=c===0; $('next').textContent=c===S.chunks.length-1?'Finish':'Next chunk'; }
function pickType(){ for(const x of ['audio/mp4','audio/webm;codecs=opus','audio/webm']) if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x)) return x; return ''; }
async function start(){
  if(!KEY){ $('status').textContent='This link is missing its key. Ask Claude for the link again.'; return; }
  try{ stream = stream || await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}}); }
  catch(e){ $('status').textContent='Microphone blocked. Open this link in Chrome or Safari and tap Allow.'; return; }
  const type=pickType(); chunks=[]; rec=new MediaRecorder(stream, type?{mimeType:type}:undefined);
  rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; rec.onstop=upload; rec.start();
  $('rec').classList.add('on'); $('rec').textContent='Stop'; $('status').textContent='Recording… say it once, then tap Stop.';
}
function stop(){ if(rec&&rec.state==='recording') rec.stop(); $('rec').classList.remove('on'); $('rec').textContent='Record'; }
async function upload(){
  const blob=new Blob(chunks,{type:(rec&&rec.mimeType)||'audio/mp4'}); $('status').textContent='Saving…'; $('rec').disabled=true;
  const label=SETNAME+' | chunk '+(c+1)+' | take '+(t+1)+' | '+S.chunks[c][0];
  try{
    const r=await fetch(URL_+'?k='+encodeURIComponent(KEY)+'&line='+(c+1)+'&text='+encodeURIComponent(label.slice(0,250)),{method:'POST',headers:{'content-type':blob.type.split(';')[0]},body:blob});
    const j=await r.json();
    if(j.ok){ t++; if(t<S.takes){ $('status').textContent='Saved ✓  Again, a little livelier.'; show(); }
      else { $('status').textContent='Saved ✓  Chunk done.'; if(c<S.chunks.length-1){ setTimeout(()=>{c++;t=0;show();$('status').textContent='Next chunk. Tap Record when ready.';},1000);} else setTimeout(finish,1000); } }
    else $('status').textContent='Not saved ('+(j.error||r.status)+'). Tap Record to try again.';
  }catch(e){ $('status').textContent='No signal? Not saved. Tap Record to try again.'; }
  $('rec').disabled=false;
}
function finish(){ $('line').textContent='All done. Thank you.'; $('how').textContent='Claude will pick the best take of each chunk and send it back for you to hear.'; $('status').textContent=''; $('dots').innerHTML=''; }
$('rec').onclick=()=>{ (rec&&rec.state==='recording')?stop():start(); };
$('next').onclick=()=>{ if(c<S.chunks.length-1){c++;t=0;show();} else finish(); };
$('back').onclick=()=>{ if(c>0){c--;t=0;show();} };
show();
</script>
</body></html>
